<style>
  * { margin:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:#f6f4ee; color:#22301f; -webkit-font-smoothing:antialiased; }
  .bar { background:#22301f; color:#f6f4ee; text-align:center; font-size:14px; font-weight:500; padding:10px 16px; letter-spacing:.02em; }
  header { display:flex; align-items:center; justify-content:space-between; padding:22px 48px; }
  .logo { font-family:'Fraunces',serif; font-weight:700; font-size:24px; }
  nav { display:flex; gap:28px; font-size:15px; font-weight:500; color:#4a5a45; }
  .hero { display:grid; grid-template-columns:1.1fr 1fr; gap:48px; align-items:center; padding:48px; max-width:1100px; margin:0 auto; }
  .kick { display:inline-block; background:#e7efdd; color:#3c5a2e; font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; border-radius:999px; padding:8px 16px; margin-bottom:20px; }
  h1 { font-family:'Fraunces',serif; font-size:56px; line-height:1.05; font-weight:700; }
  .hero p { margin-top:18px; font-size:18px; line-height:1.6; color:#4a5a45; max-width:44ch; }
  .cta { display:inline-block; margin-top:28px; background:#3c5a2e; color:#fff; font-weight:600; font-size:17px; padding:16px 32px; border-radius:12px; text-decoration:none; }
  .art { aspect-ratio:1; border-radius:24px; background:linear-gradient(160deg,#dfe9d2,#b9cfa4); position:relative; overflow:hidden; }
  .art svg { position:absolute; inset:0; width:100%; height:100%; }
  footer { text-align:center; padding:32px; font-size:13px; color:#8a967f; }
  @media (max-width:760px){ .hero{grid-template-columns:1fr; padding:32px 24px;} h1{font-size:40px;} header{padding:18px 24px;} nav{display:none;} }
</style>
</head>
<body>
  <div class="bar">Spring Sale — 20% off everything green, this week only</div>
  <header>
    <div class="logo">Fern &amp; Frame</div>
    <nav><span>Plants</span><span>Pots</span><span>Care</span><span>About</span></nav>
  </header>
  <main class="hero">
    <div>
      <span class="kick">Spring Sale</span>
      <h1>Bring the outside in.</h1>
      <p>Hardy, happy houseplants delivered to your door — potted, fed, and ready for their new windowsill.</p>
      <a class="cta" href="#">Shop the sale</a>

    <div class="art">

        <g fill="#557a3e">
          <path d="M197 252 C 175 225, 150 215, 112 218 C 145 250, 172 258, 195 256 Z"/>
          <path d="M203 252 C 226 228, 252 220, 288 224 C 254 253, 228 259, 205 256 Z"/>

    </div>
  </main>
  <footer>Fern &amp; Frame is a fictional shop used for analytics demos.</footer>
