<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Opening…</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f7f8fa;height:100vh;display:flex;align-items:center;justify-content:center}
.card{text-align:center;padding:24px}
.pill{display:inline-block;background:#fff;border:2px solid #009EFF;border-radius:999px;color:#0b1728;
  font-size:19px;font-weight:700;padding:14px 26px;box-shadow:0 12px 34px rgba(0,129,209,.15)}
.pill em{font-style:normal;color:#0081d1}
p{margin-top:18px;color:#6b7280;font-weight:600;font-size:15px}
.dots::after{content:'';animation:d 1.2s steps(4) infinite}
@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
</style></head>
<body><div class="card">
  <div class="pill"><em>go.linklyhq.com</em>/app</div>
  <p class="dots">Opening</p>
</div>
<script>setTimeout(function(){location.href='https://go.linklyhq.com/app';},3500);</script>
</body></html>
